#  opencharly/pod-ollama — the ollama service family: the GPU-agnostic `ollama`
#  candy (root charly.yml) plus the two boxes that serve it, each proving one
#  backend choice (`ollama-cdi` on the CDI pod base, `ollama-rocm` on plain
#  CachyOS). The boxes and their disposable beds live HERE, with the service they
#  test (AGENTS.md "Repo classes and naming": a bed lives with the thing it
#  tests); a `distro-*` repo holds the distro family, not one service's box.
#
#  A standalone consumer declares what a copy inside the distro inherited: the
#  base as a NAMESPACED import at the project root (a namespace mounted by a
#  discovered document does not resolve a box's own `base:`), and the pixi/aur
#  builder vocabulary (a builder map does not cross a namespace boundary).
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    builder:
        aur: arch.arch-builder
        cargo: arch.arch-builder
        npm: arch.arch-builder
        pixi: arch.arch-builder
    merge:
        auto: false
        max_mb: 128
import:
    # `ollama-rocm` bases on the CachyOS base directly.
    - cachyos: '@github.com/opencharly/distro-cachyos:v2026.331.0132'
    # The builder vocabulary the boxes route their pixi/npm/cargo/aur steps to.
    - arch: '@github.com/opencharly/distro-arch:v2026.330.1808'
    # The CDI POD base: a pod takes its GPU driver from the HOST through the CDI
    # spec, so its image bakes no driver user-space and carries no nvidia-ctk.
    - podcdi: '@github.com/opencharly/pod-cdi:v2026.329.2115'
discover:
    - path: box
      recursive: true

ollama:
    candy:
        description: |
            GPU-agnostic Ollama LLM inference server on port 11434
            Installs the Ollama binary and runs `ollama serve` as a custom supervisord
            service that listens on 0.0.0.0:11434 (no systemd). Two install paths, one
            resulting layout (/usr/bin/ollama plus the backend libraries under
            /usr/lib/ollama): on a distro that PACKAGES ollama the package is installed
            and the package manager owns the version; everywhere else the upstream
            release tarball is extracted to /usr at the version the var OLLAMA_VERSION
            selects. That var is PINNED to a release tag and must stay one: the download
            cache is content-addressed by the sha256 of the URL, so a `latest` URL would
            hash to one key forever and serve the first tarball it ever fetched, long
            after upstream moved on. The candy declares NO GPU dependency — a GPU backend is
            an IMAGE-level composition choice (compose ollama-cuda or ollama-rocm). What that
            buys differs by install path, and the difference is worth stating rather than
            averaging: on a PACKAGED distro the base package is genuinely CPU-only at 75 MiB
            and a backend is strictly opt-in, which is what keeps this layer small; on the
            TARBALL path the single upstream archive already contains the CUDA backend, so a
            tarball consumer pays for it whether or not any box composes ollama-cuda. Pulled models persist under the ~/.ollama models volume. The running
            service exposes the Ollama HTTP API (e.g. /api/tags) so any composing box
            can serve and query local models. The companion plugin candy plugin-ollama
            adds the `charly ollama` management CLI against a deployed server. The service
            itself runs a charly-owned wrapper: it pulls the OLLAMA_PULL_MODELS defaults and
            gates the start on GPU readiness, so a start under VRAM pressure fails loudly
            (supervisord retries) instead of silently running a CPU-only server on a GPU pod —
            `ollama serve` probes the GPU exactly once, at startup.
        require:
            # GPU-agnostic: the ollama binary auto-detects the GPU at runtime (CPU
            # fallback when none present), so CUDA is an IMAGE-level composition choice
            # (the `ollama` image lists `cuda` explicitly), NOT a layer dependency.
            # This lets CPU consumers (e.g. `openclaw-desktop` on cachyos) compose the
            # layer without dragging the Fedora/NVIDIA `cuda` layer onto a pac base.
            - '@github.com/opencharly/layer-supervisord:v2026.314.0710'
        var:
            # Upstream Ollama release for the TARBALL path only — the distros that
            # package ollama let their package manager own the version.
            #
            # A concrete tag, NOT `latest`, and the reason is correctness rather than
            # taste. The download verb content-addresses its cache by sha256 OF THE URL.
            # With `latest` the URL is constant while the artifact behind it changes, so
            # the cache would serve whichever build was fetched first, forever — a silent
            # pin to an arbitrary old version that no amount of rebuilding would shake
            # loose. A `latest` URL and a content-addressed cache are incompatible; the
            # tag is what makes the key honest.
            #
            # (Secondarily: GitHub serves the two cases from structurally different URLs —
            # releases/latest/download/... vs releases/download/<tag>/... — so one template
            # could not express both anyway, and pinning matches the house pattern set by
            # CUE_VERSION and APKEEP_VERSION.) Bump it here to move the tarball distros.
            OLLAMA_VERSION: v0.40.17
        distro:
            # Arch (and its derivatives, CachyOS included) ships ollama in `extra`,
            # tracking upstream closely — 0.40.17-1 is in `extra` today (package built
            # 2026-11-21; upstream published v0.40.17 on 2026-11-10). The packaged base
            # is 75 MiB installed (19 MiB download); the upstream tarball it replaces is
            # a 1.44 GiB DOWNLOAD, because that one archive bundles the CPU and CUDA
            # backends together (ROCm is NOT in it — upstream publishes that as a
            # separate ollama-linux-amd64-rocm archive), while the packages split even
            # CUDA out into the ollama-cuda add-on this candy deliberately does NOT
            # require.
            arch:
                package:
                    - ollama
        env:
            OLLAMA_HOST: "0.0.0.0"
            OLLAMA_MODELS: "~/.ollama/models"
            # OLLAMA_PULL_MODELS — the model ids this pod carries as its DEFAULTS, as a
            # space-separated list, pulled once at container start by the
            # `ollama-models` program below. EMPTY here on purpose: this candy is also
            # composed by CPU-only consumers (`openclaw-desktop` and friends), and a
            # default list at this layer would make every one of them start downloading
            # gigabytes. The list belongs one layer up — a GPU box sets it (the
            # distro-cachyos `ollama-cdi` box does), and a deploy or a disposable bed
            # overrides it per run. The store is the persistent `models` volume, so a
            # pull happens once per host; `ollama pull` is idempotent, so later starts
            # are no-ops.
            OLLAMA_PULL_MODELS: ""
            # GPU-readiness gate for the server wrapper. `ollama serve` decides GPU
            # availability ONCE, at startup, by creating a CUDA context and reading the
            # device's memory; under VRAM pressure that context creation fails, the device
            # is skipped ("skipping pseudo-device with zero memory"), and the server runs
            # CPU-ONLY for its whole lifetime — even after the VRAM frees. The wrapper
            # therefore waits for a GPU with real free memory before starting the server,
            # and refuses to start it CPU-only on a pod that has a GPU passed in.
            # Set OLLAMA_GPU_MIN_FREE_MIB to 0 to disable the gate (explicit CPU fallback).
            OLLAMA_GPU_MIN_FREE_MIB: "512"
            OLLAMA_GPU_WAIT_SECONDS: "600"
        env_provide:
            OLLAMA_HOST: "http://{{.ContainerName}}:11434"
        port:
            - 11434
        volume:
            - name: models
              path: "~/.ollama"
        alias:
            - name: ollama
              command: ollama
        service:
            - name: ollama
              # A charly-owned wrapper, not `ollama serve` directly: it starts the server and
              # rides the default-model pull (OLLAMA_PULL_MODELS) alongside it as a background
              # child, then waits on the server so supervisord keeps supervising ONE process.
              #
              # Why not a separate one-shot program: the rendered supervisord fragment carries
              # no `startsecs`, and supervisord marks ANY exit before `startsecs` (default 1s)
              # as a failed start (BACKOFF, "Exited too quickly") regardless of `autorestart`;
              # an immediate-exit program would retry `startretries` times and go FATAL. The
              # schema can express `type: oneshot`/`start_sec`, the supervisord template does
              # not render them — measured on the generated fragment, filed separately. Riding
              # with the server also means a failed pull never puts the server into a bad
              # supervisor state: it logs and the next start retries it.
              exec: /opt/ollama/start-ollama.sh
              restart: always
              enable: true
              scope: system
        plan:
            # Capability-gated, not distro-gated. The `distro:` package sections above
            # compile into the plan BEFORE this step (BuildDeployPlan phase 1 vs phase 3),
            # so on a distro that packages ollama the binary already exists here and
            # `unless_exists:` skips the fetch entirely. Detection rather than a distro
            # name, so any distro that later gains an ollama package is picked up with no
            # edit — and a plan step has no build-time distro filter to gate it with
            # anyway (`exclude_distro:` is read by the check runner, not the emitter).
            #
            # This is the declarative `download:` verb rather than a hand-rolled curl, so
            # it keeps what the verb provides and a hand-rolled step forfeits: the
            # content-addressed /tmp/downloads cache (no re-fetch of a 1.44 GiB archive on
            # every cache-miss build), the atomic .part -> mv rename, and the stage-user
            # -correct cache mount. `unless_exists:` is the capability that made that
            # possible; before it, the gate could only be expressed by abandoning the verb.
            - run: install the upstream ollama release tarball on distros that ship no ollama package (var OLLAMA_VERSION)
              download: "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
              extract: tar.zst
              to: /usr
              unless_exists: /usr/bin/ollama
              run_as: root
            - check: the ollama binary is installed at /usr/bin/ollama
              file:
                file: /usr/bin/ollama
                exists: true
            # The server wrapper. Charly-owned (written here, never downloaded from an
            # upstream install tree): start the server, ride the default-model pull beside it,
            # forward signals, and return the server's exit code. `write:` keeps the body out
            # of a shell heredoc so `$`, `${…}` and `!` are delivered byte-for-byte.
            - run: write the charly-owned ollama server wrapper
              write: /opt/ollama/start-ollama.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                # start-ollama.sh — the ollama service's entrypoint.
                #
                # Starts `ollama serve`, and when OLLAMA_PULL_MODELS is non-empty rides a
                # background pull of those models alongside it: bounded wait for the API,
                # then an idempotent `ollama pull` per id. An empty list is a no-op, so a
                # CPU-only consumer downloads nothing. The wrapper stays in the foreground
                # and waits on the server, so supervisord supervises ONE process and a
                # failed pull never changes the server's supervisor state.
                set -uo pipefail

                pull_models() {
                  # Bounded readiness wait: the deadline is the guard, not a blind retry.
                  local deadline=$((SECONDS + 120))
                  until ollama list >/dev/null 2>&1; do
                    if [ "$SECONDS" -ge "$deadline" ]; then
                      echo "ollama-models: the ollama API did not answer within 120s" >&2
                      return 1
                    fi
                    sleep 2
                  done
                  local model
                  for model in $OLLAMA_PULL_MODELS; do
                    [ -n "$model" ] || continue
                    echo "ollama-models: pulling ${model}"
                    if ! ollama pull "${model}"; then
                      echo "ollama-models: pull failed for ${model}" >&2
                      return 1
                    fi
                  done
                  echo "ollama-models: every declared model is present"
                }

                # wait_for_gpu blocks until an NVIDIA device passed into this pod reports
                # enough free VRAM for `ollama serve`'s one-shot CUDA discovery, or the
                # deadline expires. A CPU-only consumer (no /dev/nvidiactl) returns
                # immediately, so the candy stays GPU-agnostic: it DETECTS a device, it does
                # not declare one.
                wait_for_gpu() {
                  [ -e /dev/nvidiactl ] || return 0
                  command -v nvidia-smi >/dev/null 2>&1 || return 0
                  local min_free="${OLLAMA_GPU_MIN_FREE_MIB:-512}"
                  [ "$min_free" -gt 0 ] || return 0
                  local deadline=$((SECONDS + ${OLLAMA_GPU_WAIT_SECONDS:-600}))
                  local free_mib
                  while :; do
                    free_mib=$(nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits 2>/dev/null | sort -n | tail -1)
                    if [ -n "$free_mib" ] && [ "$free_mib" -ge "$min_free" ]; then
                      echo "ollama-gpu: ${free_mib} MiB free (>= ${min_free} MiB) — starting the server with GPU access"
                      return 0
                    fi
                    if [ "$SECONDS" -ge "$deadline" ]; then
                      echo "ollama-gpu: no GPU with >= ${min_free} MiB free within ${OLLAMA_GPU_WAIT_SECONDS:-600}s (last reading: ${free_mib:-unavailable} MiB)." >&2
                      echo "ollama-gpu: refusing to start the server CPU-only on a pod that has a GPU; supervisord will retry. Set OLLAMA_GPU_MIN_FREE_MIB=0 to allow a CPU fallback deliberately." >&2
                      return 1
                    fi
                    sleep 5
                  done
                }

                wait_for_gpu || exit 1

                ollama serve &
                serve_pid=$!

                # Forward a stop to the server; supervisord signals only this wrapper.
                forward() { kill -TERM "$serve_pid" 2>/dev/null || true; }
                trap forward TERM INT QUIT

                if [ -n "${OLLAMA_PULL_MODELS:-}" ]; then
                  pull_models &
                fi

                wait "$serve_pid"
                status=$?

                # A forwarded TERM/INT/QUIT interrupts `wait` while the server is still shutting
                # down, and its return value is then the wrapper's 128+signal, not the server's
                # own status. Wait AGAIN so the wrapper outlives the server (releasing port
                # 11434 before supervisord restarts it) and propagate the server's real exit
                # code.
                if kill -0 "$serve_pid" 2>/dev/null; then
                  wait "$serve_pid"
                  status=$?
                fi

                exit "$status"
            - check: the ollama server wrapper is installed at /opt/ollama/start-ollama.sh
              file:
                file: /opt/ollama/start-ollama.sh
                exists: true
            # The R7 discriminator for the OLLAMA_VERSION pin — the ONE probe here that
            # can fail on a version bump. Every other step passes at ANY upstream
            # release: the runtime `ollama --version` step asserts only the `^ollama
            # version` PREFIX, and the API steps assert serving, not which binary
            # serves. So without this step a bump ships with no coverage that could go
            # red, which is the "coverage must fail without the change" rule (R7).
            #
            # Build scope, so it also runs under `charly check box` on a built artifact,
            # and it reads the CLIENT version line — `ollama --version` prints
            # `Warning: client version is <v>` whether or not a server is reachable, and
            # adds `ollama version is <server-v>` when one is. The client line is present
            # in every case, so `contains` needs no server and cannot be satisfied by a
            # server's different version alone.
            #
            # `exclude_distro` names the packaged path because the pin binds ONLY where
            # this candy installs the tarball: Arch/CachyOS take the `ollama` package and
            # pacman owns the version there, so asserting OLLAMA_VERSION on them would be
            # a false failure the day the package lags upstream. The skip is the design,
            # not a missing assertion — the tarball path (the one this var moves) runs it.
            #
            # The literal below IS the expectation and must move WITH `var.OLLAMA_VERSION`;
            # a test that read the var would agree with any value it was given and could
            # never fail.
            - check: the installed ollama binary reports the release this candy pins (var OLLAMA_VERSION)
              id: ollama-version-pinned
              exclude_distro:
                - arch
                - cachyos
              exit_status: 0
              command: ollama --version
              stdout:
                - contains: "0.40.17"
            - check: the running ollama service answers the model-tags API with HTTP 200 on port 11434
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:11434}/api/tags
                status: 200
            - check: the ollama CLI reports an "ollama version" string
              stdout:
                - matches: "^ollama version"
              context:
                - runtime
              command: ollama --version
            - check: the ollama CLI lists models against the live service with exit 0
              exit_status: 0
              context:
                - runtime
              command: ollama list
            # Host-side proof of the companion command:ollama plugin, authored HERE on
            # the candy that provides the server rather than on any one bed, so every
            # box composing ollama inherits it (R3) instead of each bed repeating the
            # steps. ${CHARLY_BIN} is the ACTIVE charly (kit.StampCharlyBin), never a
            # stale PATH pick, and is stamped for any runtime check run — not just beds.
            - check: charly ollama help exits 0 and prints the plugin usage, proving the compiled-in command:ollama plugin registers and dispatches
              id: ollama-cli-help
              exit_status: 0
              stdout:
                - contains: 'manage a deployed Ollama server'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} ollama help
                in_container: false
            - check: charly ollama version reports the server version over the published port, proving a live API round-trip against the deployed server
              id: ollama-cli-version
              exit_status: 0
              stdout:
                - contains: 'ollama server version is'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} ollama version --server http://127.0.0.1:${HOST_PORT:11434}
                in_container: false
            - check: charly ollama list prints the model table header over the published port, proving the list API path against the deployed server
              id: ollama-cli-list
              exit_status: 0
              stdout:
                - contains: 'NAME'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} ollama list --server http://127.0.0.1:${HOST_PORT:11434}
                in_container: false
            # R7 discriminators that FAIL without this change: neither can pass on an image
            # whose service still execs `ollama serve` directly.
            - check: the supervised ollama server runs the charly wrapper, not `ollama serve` directly
              id: ollama-wrapper-entrypoint
              exit_status: 0
              context:
                - runtime
              command:
                command: grep -q 'start[-]ollama' /proc/[0-9]*/cmdline
                in_container: true
            # Committed coverage for the PULL: runs the real wrapper on a scratch port with one
            # small model declared, waits (bounded, with a deadline) for the wrapper's own
            # completion line, then asserts it. Fails without the wrapper (no script to run) and
            # with a broken pull (the line never appears). OLLAMA_GPU_MIN_FREE_MIB=0 keeps it
            # independent of GPU state, so it runs on any composing bed, GPU or not.
            - check: the wrapper pulls a declared model and reports every declared model present
              id: ollama-pull-declared-model
              exit_status: 0
              timeout: 15m
              context:
                - runtime
              command:
                command: |
                  log=/tmp/ollama-pull-check.log
                  OLLAMA_GPU_MIN_FREE_MIB=0 OLLAMA_HOST=127.0.0.1:11507 OLLAMA_PULL_MODELS=smollm2:135m \
                    /opt/ollama/start-ollama.sh >"$log" 2>&1 &
                  w=$!
                  rc=1
                  i=0
                  while [ "$i" -lt 300 ]; do
                    if grep -q "every declared model is present" "$log" 2>/dev/null; then rc=0; break; fi
                    if grep -q "pull failed for" "$log" 2>/dev/null; then break; fi
                    sleep 1
                    i=$((i+1))
                  done
                  kill -TERM "$w" 2>/dev/null
                  wait "$w" 2>/dev/null
                  if [ "$rc" -ne 0 ]; then echo "--- wrapper log ---" >&2; cat "$log" >&2; fi
                  exit "$rc"
                in_container: true
            - check: the GPU readiness gate refuses to start the server when no GPU has the required free memory, and names the reason
              id: ollama-gpu-gate-refuses
              exit_status: 0
              context:
                - runtime
              command:
                command: |
                  # On an image with no GPU device the gate's own no-op branch is what runs;
                  # say so, so a CPU-only run is visibly a skip rather than a vacuous pass.
                  if [ ! -e /dev/nvidiactl ]; then
                    echo "SKIP: no /dev/nvidiactl in this image — the GPU branch does not apply"
                    exit 0
                  fi
                  out=$(OLLAMA_GPU_MIN_FREE_MIB=999999 OLLAMA_GPU_WAIT_SECONDS=1 /opt/ollama/start-ollama.sh 2>&1)
                  rc=$?
                  printf '%s\n' "$out"
                  # rc 1 AND the refusal text: the text can only appear AFTER nvidia-smi returned a
                  # number below the impossible threshold, so this cannot pass without taking the
                  # GPU branch.
                  [ "$rc" -eq 1 ] || exit 1
                  printf '%s\n' "$out" | grep -q "refusing to start the server"
                in_container: true
            - agent-check: models pulled via `ollama pull` are stored under the ~/.ollama models volume and survive a service restart

ollama-skill:
    skill:
        name: ollama
        family: ollama
        owner: ollama
        description: |-
            Standalone Ollama LLM inference server. This candy DECLARES no GPU dependency —
            a backend is composed at the box level (`ollama-cuda` / `ollama-rocm`). What that
            yields differs by install path: on a packaged distro the base is genuinely CPU-only,
            while on a tarball distro the single upstream archive already contains CUDA, so the
            declaration is about what this candy REQUIRES, not about what ends up in the image.
            Runs as a supervisord service on port 11434 with persistent model storage.
            MUST be invoked before building, deploying, configuring, or troubleshooting the ollama box.

ollama-layer-skill:
    skill:
        name: ollama-layer
        family: ollama
        owner: ollama
# Disposable R10 pod beds for the two ollama boxes. Each drives the full
# `charly check run` sequence (build → check box → deploy → check live → fresh
# update → tear down) on the image of the same name. Deploy- and build-scope
# check coverage is inherited from the composed layers (the "lowest level"
# principle); the beds add only what the BOX promises.
check-cachyos-ollama-pod:
    pod:
        image: ollama-cdi
        disposable: true
        lifecycle: dev
        requires_shared: [nvidia-gpu]
        # NO OLLAMA_PULL_MODELS override: the deployed pod carries the BOX's four-model default, so
        # the bed pulls and proves exactly what ships. The list is read back from the runtime env
        # (below), never restated here — one canonical list (R2).
        description: >-
            Sole proof the CachyOS GPU ollama-cdi LLM-server image composes and serves on the Arch CUDA base, that the packaged CUDA backend is present, that the compiled-in command:ollama plugin works end-to-end, AND that real inference runs on the passed-through NVIDIA GPU. Builds and deploys the ollama-cdi pod and runs the checks baked into the ollama, ollama-cuda and dbus candies — server HTTP/API liveness, binary/service/port/file probes, the CUDA backend library, and the host-side charly ollama help/version/list steps over the auto-allocated host port — plus the bed's own GPU-inference plan: nvidia-smi enumerates the card via CDI, a tiny model answers a prompt (a real generation pass), and `ollama ps` reports the model 100% GPU-resident (proving the CUDA backend executed it, not CPU fallback). The `requires_shared: [nvidia-gpu]` makes the arbiter flip the IOMMU group vfio→nvidia at deploy and back at teardown, so the pod reaches the card through CDI. On Arch the server comes from the split `ollama` package rather than the upstream tarball, so this bed is also the proof of that install path.
        plan:
            - check: the passed-through NVIDIA GPU is visible inside the container via CDI — nvidia-smi enumerates the card
              id: ollama-gpu-visible
              context:
                - runtime
              command: nvidia-smi -L
              stdout:
                - contains: "NVIDIA"
            - check: ollama runs a real generation pass — a tiny model answers a prompt (the first run pulls the model, hence the raised timeout)
              id: ollama-gpu-inference
              context:
                - runtime
              timeout: 5m
              exit_status: 0
              command: ollama run qwen2.5:0.5b "What is 2+2? Reply with just the number."
            # The R7 discriminator for the box's default set: EVERY model the deployed env declares
            # must be in the store, put there by the SERVICE WRAPPER'S start-time pull — no step in
            # this plan pulls them. It goes RED on an image whose service still execs `ollama serve`
            # directly, and RED for a mistyped or removed tag (exact match, `grep -qxF "$m"`).
            #
            # This is an ASSERTION with a bounded wait, not a second pull. Two earlier versions of
            # this check failed for reasons unrelated to the store and are recorded here so they are
            # not retried: (1) run 2026.328.0220 started a SECOND scratch wrapper on another port and
            # sat out its deadline because that second `ollama serve` never answered; (2) run
            # 2026.328.0315 pulled the models ITSELF and was killed while racing the wrapper's own
            # concurrent pull of the same 6 GB. And run 2026.328.0152 failed because THAT run raised
            # the bed's GPU gate to 2 GiB on a contended card, so the wrapper refused to start the
            # server at all and the start-time pull never ran — an artefact of the gate experiment,
            # not of this check. The wrapper pulls at start; this asserts the result.
            - check: every model the box declares in OLLAMA_PULL_MODELS is present in the model store
              id: ollama-default-models-present
              context:
                - runtime
              timeout: 40m
              exit_status: 0
              command:
                command: |
                  models="$OLLAMA_PULL_MODELS"
                  if [ -z "$models" ]; then echo "the deployed env declares no OLLAMA_PULL_MODELS"; exit 1; fi
                  echo "declared: $models"
                  i=0
                  while [ "$i" -lt 900 ]; do
                    all=1
                    for m in $models; do
                      ollama list | awk 'NR>1 {print $1}' | grep -qxF "$m" || all=0
                    done
                    if [ "$all" -eq 1 ]; then break; fi
                    sleep 2
                    i=$((i+1))
                  done
                  for m in $models; do
                    if ollama list | awk 'NR>1 {print $1}' | grep -qxF "$m"; then echo "PRESENT $m"; else echo "MISSING $m"; exit 1; fi
                  done
                in_container: true
            - check: the model is resident on the GPU — ollama ps reports 100% GPU in the processor column, proving the CUDA backend executed the generation rather than CPU fallback
              id: ollama-gpu-resident
              context:
                - runtime
              command: |
                set -eu
                # LOAD a model WITH a keep-alive first. `ollama ps` lists only LOADED models, and a
                # bare `ollama ps` at this point lists none: the preceding checks can run after the
                # server's default keep-alive window, so the check was red on a CLEAN image and its
                # subject (the CUDA backend executed) was already proven by ollama-gpu-inference.
                m=$(ollama list | awk 'NR>1 {print $1}' | head -1)
                curl -fsS http://127.0.0.1:11434/api/generate \
                  -d "{\"model\":\"$m\",\"prompt\":\"hi\",\"keep_alive\":\"10m\",\"stream\":false}" >/dev/null
                ollama ps
              stdout:
                - contains: "100% GPU"
# check-cachyos-ollama-rocm-pod — the AMD sibling of check-cachyos-ollama-pod, and
# the sole consumer that proves candy/ollama-rocm. Plain cachyos base (no NVIDIA),
# so it also proves the base ollama candy composes without any GPU candy at all.
# SCOPE BOUNDARY, stated so nobody reads more into a green run than it earns: on a
# host with no AMD card this proves composition, that the ROCm backend library
# actually ships, and that the server reaches steady state — NOT that inference
# runs on an AMD GPU. Live GPU enumeration needs a real card passed through, the
# same limit candy/rocm states for itself. Ollama falls back to CPU here, which is
# why every inherited runtime check still passes.
check-cachyos-ollama-rocm-pod:
    pod:
        image: ollama-rocm
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS AMD ollama-rocm image composes on the plain CachyOS base and serves, and the sole consumer proving the ollama-rocm backend candy. Builds and deploys the ollama-rocm pod and runs the checks baked into the ollama, ollama-rocm and dbus candies — server HTTP/API liveness, binary/service/port/file probes, the ROCm/HIP backend library, and the host-side charly ollama help/version/list steps over the auto-allocated host port. Without an AMD card passed through the server runs CPU inference, so this bed proves the backend SHIPS, not that it executes on a GPU.
